[www]
user = www-data
group = www-data

; Reachable from the nginx container over the Docker network
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Send worker output to the container logs
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
